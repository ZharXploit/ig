<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacked By ZharSec</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d0d;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            text-shadow: 0 0 10px #00ff66, 0 0 20px #00ff66;
        }

        /* Scanline Overlay untuk Efek Layar CRT/Monitor Tua */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
        }

        .container {
            text-align: center;
            z-index: 1;
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            letter-spacing: 3px;
            animation: glitch 1.5s infinite alternate;
        }

        p.system-status {
            color: #ff3333;
            text-shadow: 0 0 10px #ff3333;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        /* Container Running Text */
        .marquee-container {
            width: 100%;
            max-width: 800px;
            background-color: rgba(0, 255, 102, 0.05);
            border: 1px solid #00ff66;
            padding: 10px 0;
            margin-top: 20px;
            overflow: hidden;
            white-space: nowrap;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
        }

        .marquee-text {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 15s linear infinite;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        /* Animasi Teks Berjalan */
        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        /* Animasi Glitch Sederhana */
        @keyframes glitch {
            0% { transform: skew(0deg); }
            20% { transform: skew(-2deg); }
            40% { transform: skew(1deg); }
            60% { opacity: 0.8; }
            80% { transform: skew(-1deg); }
            100% { transform: skew(0deg); opacity: 1; }
        }

        footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #888;
            text-shadow: none;
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>

    <div class="container">

        <h1>Hacked By ZharSec</h1>

            </div>
        </div>

        <footer>
            <p>ZharSec Cyber Team &copy; 2026</p>
        </footer>
    </div>

</body>
</html>
